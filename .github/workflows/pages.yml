# Publica o repositório no GitHub Pages (strata.js, strata.css e os exemplos),
# a cada push na main. Requer Settings → Pages → Source: GitHub Actions.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar o site
        run: |
          mkdir _site
          cp strata.js strata.css _site/
          cp -r exemplos _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=exemplos/exemplo3.html"><a href="exemplos/exemplo3.html">Exemplo</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
